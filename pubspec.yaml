name: puffree
description: Puffree — стильное и минималистичное приложение для отказа от курения. Уровни, ежедневные задания, мотивация и поддержка.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  flutter_animate: ^4.5.0
  iconsax: ^0.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0

  # Premium
  purchases_flutter: ^8.1.0

  # Notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.0
  path_provider: ^2.1.4
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1
  firebase_storage: ^13.6.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/

# Иконка приложения
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# Нативный splash
flutter_native_splash:
  color: "#0F766E"
  color_dark: "#0C0C0C"
  android: true
  ios: true